# =============================================================================
# AML NGS Pipeline - Configuración principal
# =============================================================================

# ── Muestras ─────────────────────────────────────────────────────────────────
samples: config/samples.tsv        # TSV con columnas: sample, fastq_r1, fastq_r2

# ── Referencia genómica ──────────────────────────────────────────────────────
reference:
  genome: resources/hg38/hg38.fa   # FASTA indexado con BWA-MEM2 y samtools
  fai:    resources/hg38/hg38.fa.fai
  dict:   resources/hg38/hg38.dict

# ── Panel / regiones de interés ──────────────────────────────────────────────
# El usuario puede reemplazar este BED por el de su panel propio
panel:
  bed: config/aml_panel_full.bed        # BED con regiones del panel (chr, start, end, nombre)
  padding: 10                      # pb de padding alrededor de cada región

# ── Bases de datos de variantes (GATK bundle hg38) ───────────────────────────
known_sites:
  dbsnp:   resources/dbsnp/Homo_sapiens_assembly38.dbsnp138.vcf.gz
  mills:   resources/known_indels/Mills_and_1000G_gold_standard.indels.hg38.vcf.gz
  g1000:   resources/known_indels/1000G_phase1.snps.high_confidence.hg38.vcf.gz

# ── Panel of Normals (PoN) para Mutect2 tumor-only ───────────────────────────
# Generado previamente con muestras normales públicas (TCGA-LAML normals)
mutect2:
  pon:         resources/pon/1000g_pon.hg38.vcf.gz  # PoN GATK public
  germline_resource: resources/af-only-gnomad.hg38.vcf.gz
  af_of_alleles_not_in_resource: 0.0000025
  # Filtros post-llamado
  min_af:      0.01    # VAF mínimo (1%) - ajustar según profundidad del panel
  max_alt_dp:  5       # mínimo de reads alternativos

# ── Anotación funcional (VEP) ─────────────────────────────────────────────────
vep:
  cache_dir:   resources/vep_cache
  cache_version: 111
  species:     homo_sapiens
  assembly:    GRCh38
  plugins:
    - CADD,resources/vep_plugins/whole_genome_SNVs.tsv.gz
    - SpliceAI,snv=resources/vep_plugins/spliceai_scores.raw.snv.hg38.vcf.gz,indel=resources/vep_plugins/spliceai_scores.raw.indel.hg38.vcf.gz
  extra_flags: >-
    --everything
    --pick
    --canonical
    --symbol
    --hgvs
    --var_synonyms
    --force_overwrite

# ── Clasificación ACMG ────────────────────────────────────────────────────────
acmg:
  # Genes de AML con reglas específicas (tier especial en AML)
  aml_genes:
    tier1: [FLT3, NPM1, DNMT3A, IDH1, IDH2, TET2, RUNX1, TP53, ASXL1, CEBPA]
    tier2: [NRAS, KRAS, PTPN11, KIT, SF3B1, SRSF2, U2AF1, STAG2, RAD21, SMC1A, SMC3, EZH2, KDM6A]
  # Umbrales de frecuencia poblacional
  freq_thresholds:
    benign:       0.05   # >5% en gnomAD → benigno (BA1)
    likely_benign: 0.01  # >1% → probablemente benigno (BS1)
    pathogenic:   0.001  # <0.1% → criterio de rareza (PM2)
  # Fuentes de evidencia funcional
  clinvar_stars_min: 1   # mínimo estrellas ClinVar para usar evidencia
  # InterVar para clasificación automática
  intervar:
    db_dir: resources/intervar/
    evidence_file: resources/intervar/PM1_genes.txt

# ── QC ────────────────────────────────────────────────────────────────────────
qc:
  min_mean_coverage: 100   # cobertura media mínima aceptable sobre el panel
  min_pct_20x:       95    # % de bases con ≥20x
  min_pct_100x:      80    # % de bases con ≥100x
  fastp:
    min_length:  50
    quality:     20
    detect_adapter: true

# ── Recursos computacionales (AWS) ────────────────────────────────────────────
resources:
  default:
    mem_mb:  8000
    threads: 4
  bwa:
    mem_mb:  32000
    threads: 16
  gatk:
    mem_mb:  16000
    threads: 4
  vep:
    mem_mb:  8000
    threads: 8

# ── Salidas ───────────────────────────────────────────────────────────────────
output:
  dir: results/
  keep_intermediate: false   # true para debugging

# ── AWS (usado si se corre con snakemake --profile aws) ──────────────────────
aws:
  s3_bucket:    s3://my-aml-pipeline-bucket   # reemplazar con tu bucket
  region:       us-east-1
  instance_type: m5.4xlarge
